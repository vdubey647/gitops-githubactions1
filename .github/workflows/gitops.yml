name: GitOps CICD

on:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [14.20.0]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present

  test-stage:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - run: echo "Running tests..."

  build-and-push-docker-image:
    name: Build Docker image and push to repositories
    runs-on: ubuntu-latest
    needs: ['build', 'test-stage']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t react-app .
          docker tag react-app vdubey357/gitops01:${{ github.sha }}
          docker push vdubey357/gitops01:${{ github.sha }}

  update-manifest-stage:
    runs-on: ubuntu-latest
    needs: ['build-and-push-docker-image']

    steps:
      - uses: actions/checkout@v3
        with:
          repository: vdubey647/gitops-githubactions2
          ref: 'main'
          token: ${{ secrets.G_TOKEN }}
          persist-credentials: false

      - name: setup git config
        run: |
          git config --global user.email "vinaydubey.11211@gmail.com"
          git config --global user.name "vdubey647"
          git remote set-url origin https://x-access-token:${{ secrets.G_TOKEN }}@github.com/vdubey647/gitops-githubactions2.git

          echo "Updating manifest with image tag: ${{ github.sha }}"

          # update the image in deployment.yaml
          sed -i "s#image:.*#image: vijaygawate/gitops01:${{ github.sha }}#g" deployment.yaml

          git add -A

          # only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update image to tag ${{ github.sha }}"
            git push origin main
          fi

      - run: echo "Manifest update completed."
